[project]
name = "titanic_mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robert Schorr", email = "<>" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.4,<5",
    "pydantic>=2.14.1",
]

[project.scripts]
titanic-mcp = "titanic_mcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
test = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
