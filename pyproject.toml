[project]
name = "titanicmcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robert Schorr", email = "<>" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
titanicmcp = "titanicmcp:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.92",
]
test = [
    "pytest>=9.1.1",
]
